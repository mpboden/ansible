---
- hosts: all 
  become: false
  pre_tasks:
    - name: install updates
      become: true
      tags: always
      ansible.builtin.apt:
        update_cache: yes
        upgrade: 'yes'
      changed_when: false

- hosts: localhost
  become: false
  tasks:
    - name: Set roles
      ansible.builtin.set_fact:
        run_roles: >-
          {% set default_excluded_roles = (exclude_roles | default([])) -%}
          {%- if ansible_run_tags | list == ['all'] -%}
          {{ core_roles | reject('in', default_excluded_roles) | list }}
          {%- else -%}
          {{ ((core_roles | select('in', ansible_run_tags) | list) + (ansible_run_tags | reject('in', default_roles) | reject('equalto', 'all') | list)) | reject('in', default_excluded_roles) | list }}
          {%- endif -%}

      tags:
        - always

    - name: Run roles
      ansible.builtin.include_role:
        apply:
          tags:
            - "{{ roles_item }}"
        name: "{{ roles_item }}"
      loop_control:
        loop_var: roles_item
      with_items: "{{ run_roles }}"
      tags:
        - always

    - name: Create symlink to dotfiles script"
      ansible.builtin.file:
          src: "{{ ansible_facts['user_dir'] }}/.dotfiles/bin/dotfiles"
          dest: "{{ ansible_facts['user_dir'] }}/bin/dotfiles"
          state: link
          force: true
